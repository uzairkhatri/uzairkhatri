<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Uzair Khatri — Engineering Telemetry &amp; Production Benchmarks</title>
  <desc id="desc">Live architectural metrics and verified production benchmarks.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="60%" stop-color="#0b1628"/>
      <stop offset="100%" stop-color="#07101b"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e5ea8"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="900" height="230" rx="16" fill="url(#cardBg)" stroke="#1e5ea8" stroke-width="1.5" filter="url(#subtleShadow)"/>

  <!-- Top Header Bar -->
  <circle cx="28" cy="28" r="5" fill="#ef4444"/>
  <circle cx="44" cy="28" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="28" r="5" fill="#22c55e"/>
  
  <text x="86" y="32" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TELEMETRY // PRODUCTION BENCHMARKS</text>
  <rect x="740" y="18" width="136" height="22" rx="11" fill="#132338" stroke="#1e5ea8" stroke-width="1"/>
  <circle cx="754" cy="29" r="3.5" fill="#22c55e"/>
  <text x="765" y="33" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600">CI VERIFIED GATES</text>

  <line x1="20" y1="46" x2="880" y2="46" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Column 1: System Scale -->
  <g transform="translate(30, 64)">
    <text x="0" y="16" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" letter-spacing="1">DISTRIBUTED SCALE</text>
    
    <text x="0" y="48" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800">1M+ <tspan font-size="14" fill="#38bdf8" font-weight="600">Users</tspan></text>
    <text x="0" y="68" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">Fintech Core Ledger (Savyour)</text>

    <text x="0" y="104" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800">10K+ <tspan font-size="14" fill="#38bdf8" font-weight="600">/ mo</tspan></text>
    <text x="0" y="124" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">Multi-Agent AI Workflows (Wellows)</text>
  </g>

  <!-- Divider 1 -->
  <line x1="310" y1="65" x2="310" y2="200" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Column 2: Measured Retrieval Quality -->
  <g transform="translate(340, 64)">
    <text x="0" y="16" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" letter-spacing="1">RAG QUALITY GATES (CI)</text>
    
    <text x="0" y="48" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800">0.9444 <tspan font-size="14" fill="#22c55e" font-weight="600">Recall@5</tspan></text>
    <text x="0" y="68" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">Hybrid Dense + Lexical Retrieval</text>

    <text x="0" y="104" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800">0.9167 <tspan font-size="14" fill="#22c55e" font-weight="600">MRR</tspan></text>
    <text x="0" y="124" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">Mean Reciprocal Rank Reranking</text>
  </g>

  <!-- Divider 2 -->
  <line x1="610" y1="65" x2="610" y2="200" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Column 3: Latency & Runtime SLAs -->
  <g transform="translate(640, 64)">
    <text x="0" y="16" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" letter-spacing="1">PRODUCTION LATENCY &amp; SLA</text>
    
    <text x="0" y="48" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800">120ms <tspan font-size="13" fill="#f59e0b" font-weight="600">from 800ms</tspan></text>
    <text x="0" y="68" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">FastAPI Async &amp; SQS Decoupling</text>

    <text x="0" y="104" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800">&lt;200ms <tspan font-size="13" fill="#22c55e" font-weight="600">Vector SLA</tspan></text>
    <text x="0" y="124" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">Qdrant In-Memory &amp; Sparse Index</text>
  </g>
</svg>
